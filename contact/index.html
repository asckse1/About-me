  <script>
    let currentlang = "en";
    let tls = {};
    fetch("ContactTL.json")
    .then( response => response.json())
    .then( data => {
      tls = data;
      setTimeout(() => {
        changeLanguage();
      }, 50);
     });
    function changeLanguage(){
      document.querySelectorAll('[data-i18n]').forEach(element => {
    const key = element.getAttribute('data-i18n');
        if (tls[currentlang] && tls[currentlang][key]) {
      element.innerHTML = tls[currentlang][key];
        };
        


    });
    if(currentlang=="en"){
          currentlang="jp";

        }
        else{
          currentlang="en";

        }
    }
  </script>
